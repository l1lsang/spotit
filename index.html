<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#356F68" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="스팟잇" />

    <meta name="robots" content="index, follow" />

    <meta
      name="description"
      content="스팟잇은 오늘의 장소와 순간을 지도 위에 남기며, 나만의 일상 지도를 만들어가는 장소 기록 SNS입니다."
    />
    <meta
      name="keywords"
      content="스팟잇, Spotit, 장소 기록, 지도 SNS, 위치 기반 SNS, 여행 기록, 맛집 기록, 카페 기록, 사진 기록, 일상 기록, 동네 기록"
    />

    <link rel="canonical" href="https://spotitmap.kr/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="스팟잇" />
    <meta property="og:title" content="스팟잇 - 오늘의 추억을 지도에 남기다" />
    <meta
      property="og:description"
      content="오늘의 추억을 지도 위에 남기고, 나만의 일상 지도를 만들어보세요."
    />
    <meta property="og:url" content="https://spotitmap.kr/" />
    <meta property="og:image" content="https://spotitmap.kr/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="스팟잇 - 오늘의 추억을 지도에 남기다" />
    <meta
      name="twitter:description"
      content="오늘의 추억을 지도 위에 남기고, 나만의 일상 지도를 만들어보세요."
    />
    <meta name="twitter:image" content="https://spotitmap.kr/icon-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "스팟잇",
        "alternateName": "Spotit",
        "url": "https://spotitmap.kr/",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "description": "스팟잇은 오늘의 장소와 순간을 지도 위에 남기며, 나만의 일상 지도를 만들어가는 장소 기록 SNS입니다.",
        "image": "https://spotitmap.kr/icon-512.png"
      }
    </script>

    <title>스팟잇 - 오늘의 추억을 지도에 남기다</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Load the optional Figma exporter only for an explicit local capture.
      if (import.meta.env.DEV && location.hash.includes('figmacapture=')) {
        const waitForScreen = async () => {
          const root = document.getElementById('root');
          if (!root?.textContent.trim() || root.querySelector('.screen-message')) {
            setTimeout(waitForScreen, 250);
            return;
          }
          await document.fonts.ready;
          setTimeout(() => {
            const captureScript = document.createElement('script');
            captureScript.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
            document.head.appendChild(captureScript);
          }, 2000);
        };
        waitForScreen();
      }
    </script>
  </body>
</html>
